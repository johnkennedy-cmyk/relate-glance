<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>relate-glance</title>
<style>
  :root {
    --surface: #15181d;
    --panel: #1c2027;
    --ink: #e6e9ef;
    --ink-2: #9aa3b2;
    --ink-3: #697180;
    --accent: #7aa7ff;      /* single-series line */
    --accent-dim: #7aa7ff33;
    --good: #51d88a;        /* live dot */
    --fact: #c89bfa;        /* fact badge, always paired with text label */
    --reads: #5ec8c8;       /* reads-served bars (separate chart, own caption) */
    --reads-dim: #5ec8c833;
    --line: #2a2f38;
    font-size: 13px;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--surface); color: var(--ink);
    font: 400 1rem/1.45 ui-sans-serif, -apple-system, "Segoe UI", sans-serif;
    padding: 12px; width: 100%; max-width: 420px;
  }
  header { display: flex; align-items: baseline; gap: 8px; margin-bottom: 10px; }
  header h1 { font-size: 1rem; font-weight: 600; letter-spacing: .01em; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ink-3); align-self: center; }
  .dot.live { background: var(--good); box-shadow: 0 0 6px var(--good); }
  #ago { color: var(--ink-2); margin-left: auto; font-variant-numeric: tabular-nums; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 10px; }
  .stat { background: var(--panel); border-radius: 6px; padding: 6px 8px; }
  .stat b { display: block; font-size: 1.15rem; font-weight: 600; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--ink-3); font-size: .8rem; text-transform: uppercase; letter-spacing: .05em; }
  .spark { background: var(--panel); border-radius: 6px; padding: 8px; margin-bottom: 10px; position: relative; }
  .spark .cap { color: var(--ink-3); font-size: .85rem; margin-bottom: 2px; }
  .spark svg { display: block; width: 100%; height: 44px; }
  #tip, #rtip {
    position: absolute; pointer-events: none; display: none;
    background: #0c0e11; border: 1px solid var(--line); border-radius: 4px;
    padding: 2px 7px; font-size: .85rem; color: var(--ink); white-space: nowrap;
    font-variant-numeric: tabular-nums; transform: translate(-50%, -130%);
  }
  ul { list-style: none; display: flex; flex-direction: column; gap: 2px; }
  li { display: flex; gap: 7px; padding: 4px 2px; border-bottom: 1px solid var(--line); align-items: baseline; }
  li:last-child { border-bottom: 0; }
  time { color: var(--ink-3); font-variant-numeric: tabular-nums; flex: none; }
  .badge { flex: none; font-size: .72rem; font-weight: 600; letter-spacing: .04em; border-radius: 3px; padding: 0 4px; }
  .badge.episode { color: var(--accent); background: var(--accent-dim); }
  .badge.fact { color: var(--fact); background: #c89bfa26; }
  .txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .about { color: var(--ink-2); }
  #err { color: #f0917b; display: none; margin-bottom: 8px; }
</style>
</head>
<body>
  <header>
    <div class="dot" id="dot"></div>
    <h1>relate</h1>
    <span id="ago">—</span>
  </header>
  <div id="err"></div>
  <div class="stats" id="stats"></div>
  <div class="spark">
    <div class="cap">writes · episodes + facts · cumulative · 7d</div>
    <svg id="svg" viewBox="0 0 300 44" preserveAspectRatio="none"></svg>
    <div id="tip"></div>
  </div>
  <div class="spark">
    <div class="cap" id="readcap">reads served · MCP tool calls / day · 7d</div>
    <svg id="rsvg" viewBox="0 0 300 44"></svg>
    <div id="rtip"></div>
  </div>
  <ul id="feed"></ul>

<script>
const $ = (id) => document.getElementById(id);
let growth = [];

function ago(iso) {
  if (!iso) return "no writes";
  const s = Math.max(0, (Date.now() - new Date(iso)) / 1000);
  if (s < 90) return `${Math.round(s)}s ago`;
  if (s < 5400) return `${Math.round(s / 60)}m ago`;
  if (s < 129600) return `${Math.round(s / 3600)}h ago`;
  return `${Math.round(s / 86400)}d ago`;
}

function stat(label, v) {
  return `<div class="stat"><b>${v.toLocaleString()}</b><span>${label}</span></div>`;
}

function drawSpark(days) {
  growth = days;
  const w = 300, h = 44, pad = 3;
  const vals = days.map((d) => d.cum);
  const min = Math.min(...vals), max = Math.max(...vals);
  const x = (i) => pad + (i * (w - 2 * pad)) / (days.length - 1);
  const y = (v) => max === min ? h / 2 : h - pad - ((v - min) * (h - 2 * pad)) / (max - min);
  const pts = vals.map((v, i) => `${x(i)},${y(v)}`).join(" ");
  $("svg").innerHTML =
    `<polygon points="${pad},${h} ${pts} ${w - pad},${h}" fill="var(--accent-dim)"/>` +
    `<polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>` +
    `<circle id="hoverpt" r="3" fill="var(--accent)" stroke="var(--surface)" stroke-width="2" style="display:none"/>`;
}

$("svg").addEventListener("mousemove", (ev) => {
  if (!growth.length) return;
  const r = $("svg").getBoundingClientRect();
  const i = Math.round(((ev.clientX - r.left) / r.width) * (growth.length - 1));
  const d = growth[Math.max(0, Math.min(growth.length - 1, i))];
  const pt = $("hoverpt");
  const w = 300, h = 44, pad = 3;
  const vals = growth.map((g) => g.cum);
  const min = Math.min(...vals), max = Math.max(...vals);
  pt.style.display = "";
  pt.setAttribute("cx", pad + (i * (w - 2 * pad)) / (growth.length - 1));
  pt.setAttribute("cy", max === min ? h / 2 : h - pad - ((d.cum - min) * (h - 2 * pad)) / (max - min));
  const tip = $("tip");
  tip.style.display = "block";
  tip.style.left = `${ev.clientX - r.left + 8}px`;
  tip.style.top = `30px`;
  tip.textContent = `${d.day.slice(5)} · ${d.cum.toLocaleString()}`;
});
$("svg").addEventListener("mouseleave", () => {
  $("tip").style.display = "none";
  const pt = $("hoverpt"); if (pt) pt.style.display = "none";
});

let readsPerDay = [];
function drawBars(days) {
  readsPerDay = days;
  const w = 300, h = 44, gap = 2;
  const bw = w / days.length - gap;
  const max = Math.max(1, ...days.map((d) => d.c));
  $("rsvg").innerHTML = days.map((d, i) => {
    const bh = Math.max(d.c > 0 ? 3 : 1, (d.c / max) * (h - 4));
    const fill = d.c > 0 ? "var(--reads)" : "var(--reads-dim)";
    return `<rect x="${i * (bw + gap)}" y="${h - bh}" width="${bw}" height="${bh}" rx="2" fill="${fill}"/>`;
  }).join("");
}
$("rsvg").addEventListener("mousemove", (ev) => {
  if (!readsPerDay.length) return;
  const r = $("rsvg").getBoundingClientRect();
  const i = Math.max(0, Math.min(readsPerDay.length - 1, Math.floor(((ev.clientX - r.left) / r.width) * readsPerDay.length)));
  const d = readsPerDay[i];
  const tip = $("rtip");
  tip.style.display = "block";
  tip.style.left = `${ev.clientX - r.left + 8}px`;
  tip.style.top = `30px`;
  tip.textContent = `${d.day.slice(5)} · ${d.c.toLocaleString()} reads`;
});
$("rsvg").addEventListener("mouseleave", () => { $("rtip").style.display = "none"; });

async function tick() {
  try {
    const r = await fetch("/api/state");
    const s = await r.json();
    if (s.error) throw new Error(s.error);
    $("err").style.display = "none";
    const lastMs = s.lastWrite ? Date.now() - new Date(s.lastWrite) : Infinity;
    $("dot").className = "dot" + (lastMs < 600_000 ? " live" : "");
    $("ago").textContent = ago(s.lastWrite);
    $("stats").innerHTML =
      stat("entities", s.counts.entities) + stat("episodes", s.counts.episodes) +
      stat("facts", s.counts.facts) + stat("rels", s.counts.rels) +
      stat("reads 24h", s.reads.last24h) +
      `<div class="stat"><b>${(s.sizeKB / 1024).toFixed(s.sizeKB > 10240 ? 0 : 1)}</b><span>MB</span></div>`;
    drawSpark(s.growth);
    drawBars(s.reads.perDay);
    $("readcap").textContent = `reads served · MCP tool calls / day · 7d` + (s.reads.lastRead ? ` · last ${ago(s.reads.lastRead)}` : "");
    $("feed").innerHTML = s.feed.map((e) => {
      const t = new Date(e.at);
      const hhmm = isNaN(t) ? "--:--" : t.toTimeString().slice(0, 5);
      const day = isNaN(t) ? "" : `${t.getMonth() + 1}/${t.getDate()} `;
      const about = e.about ? ` <span class="about">→ ${esc(e.about)}</span>` : "";
      return `<li><time>${day}${hhmm}</time><span class="badge ${e.typ}">${e.typ === "episode" ? "EP" : "FACT"}</span><span class="txt">${esc(e.text)}${about}</span></li>`;
    }).join("");
  } catch (err) {
    $("err").textContent = String(err);
    $("err").style.display = "block";
  }
}
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
tick();
setInterval(tick, 5000);
</script>
</body>
</html>
